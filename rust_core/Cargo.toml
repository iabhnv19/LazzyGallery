[package]
name = "gallery_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gallery_rust_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
image = { version = "0.24.7", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.23.0", default-features = false }
rexif = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
